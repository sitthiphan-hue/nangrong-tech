<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผนที่และผัง - วิทยาลัยเทคนิคนางรอง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 🔗 ลิงก์เชื่อมโยงกับไฟล์สีหลังบ้าน -->
    <link rel="stylesheet" href="style.css">
    <script> tailwind.config = { darkMode: 'class' } </script>
</head>
<body class="transition-colors duration-300">

    <nav class="theme-nav text-white p-4 flex justify-between items-center sticky top-0 shadow-lg z-50">
        <h1 class="font-bold text-xl theme-text-accent">วิทยาลัยเทคนิคนางรอง</h1>
        <div class="flex items-center space-x-4">
            <a href="index.html" class="hover:opacity-80">หน้าแรก</a>
            <a href="buildings.html" class="hover:opacity-80">ทำเนียบอาคาร</a>
            <a href="map.html" class="underline font-bold theme-text-accent">แผนที่ & ผัง</a>
            <a href="contact.html" class="hover:opacity-80">ติดต่อเรา</a>
            <button onclick="toggleDarkMode()" class="p-2 border rounded-lg text-sm bg-black/20 hover:bg-black/40">🌙 / ☀️ โหมด</button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto my-8 p-6 theme-card rounded-xl shadow-md border">
        <div class="flex justify-between items-center mb-6 border-b pb-2">
            <h2 class="text-2xl font-bold theme-text-accent">แผนที่และผังวิทยาลัย</h2>
            <!-- 🔗 ปุ่มลิงก์ไปหน้าทำเนียบอาคาร -->
            <a href="buildings.html" class="theme-btn-accent text-sm py-1.5 px-4 rounded-lg font-bold shadow transition">
                🏢 ดูทำเนียบอาคารและห้องเรียน ➡️
            </a>
        </div>

        <div class="mb-8">
            <h3 class="font-bold text-lg mb-2">ผังอาคารภายในวิทยาลัย</h3>
            <!-- 📂 ปรับขนาดรูปแผนผังตามสัดส่วน 2048x1364 ให้แสดงผลเต็มตา ไม่ถูกตัด -->
            <img src="img/แผนผัง.1.jpg" width="2048" height="1364" class="w-full h-auto max-h-[600px] object-contain mx-auto rounded-lg shadow border mb-2 bg-black/5" alt="ผังวิทยาลัยเทคนิคนางรอง">
            <p class="text-sm text-center theme-text-muted">ภาพจำลองผังอาคารเรียนและศูนย์ฝึกปฏิบัติงาน วิทยาลัยเทคนิคนางรอง</p>
        </div>

        <div>
            <h3 class="font-bold text-lg mb-2">พิกัดแผนที่ (Google Maps)</h3>
            <div class="w-full h-64 bg-slate-200 dark:bg-slate-700 rounded-lg overflow-hidden shadow mb-4">
                <iframe class="w-full h-full border-0" src="https://maps.google.com/maps?q=วิทยาลัยเทคนิคนางรอง&t=&z=15&ie=UTF8&iwloc=&output=embed" allowfullscreen></iframe>
            </div>
            <a href="https://maps.google.com/?q=วิทยาลัยเทคนิคนางรอง" target="_blank" class="inline-block theme-btn-primary px-6 py-2.5 rounded-lg font-bold shadow transition">📍 นำทางด้วย Google Maps</a>
        </div>
    </div>

    <!-- ปุ่มย้อนกลับด้านล่าง -->
    <div class="max-w-4xl mx-auto my-8 text-center space-x-3">
        <a href="buildings.html" class="inline-block theme-btn-primary py-2 px-6 rounded-lg font-bold shadow transition">🏢 ไปหน้าทำเนียบอาคาร</a>
        <a href="index.html" class="inline-block theme-btn-accent py-2 px-6 rounded-lg font-bold shadow transition">⬅️ กลับสู่หน้าแรก</a>
    </div>

    <script>
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    </script>
</body>
</html>
